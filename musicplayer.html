<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Playlist</title>
    <style>
        :root {
            /* Palette extracted directly from your beach image */
            --ocean-blue: #4a6b82;
            --foam-white: #f4f7f6;
            --sand-beige: #dcd6cd;
            --accent-gold: #dfb15b; /* Sunset accent */
            --text-dark: #2c3539;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Times New Roman", Times, serif;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            
            /* Background configuration using your image */
            background: url('image.jpg') no-repeat center center fixed;
            background-size: cover;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Summer Fade-in Animation for the whole page */
        @keyframes summerBreeze {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Subtle wave-like pulse for the active track text */
        @keyframes wavePulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); color: var(--ocean-blue); }
            100% { transform: scale(1); }
        }

        .main-wrapper {
            animation: summerBreeze 1.5s ease-out;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 2; /* Ensures content stays above background masks */
        }

        /* Glassmorphism Player Box to look clean over the beach image */
        .player-container, .playlist-container {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }

        .player-container:hover, .playlist-container:hover {
            box-shadow: 0 15px 35px rgba(74, 107, 130, 0.25);
            background: rgba(255, 255, 255, 0.82);
        }

        h1 {
            margin-top: 0;
            font-size: 2.8rem;
            font-weight: normal;
            color: var(--ocean-blue);
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
            margin-bottom: 5px;
        }

        .subtitle {
            font-style: italic;
            font-size: 1.1rem;
            color: #66757f;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .now-playing {
            font-style: italic;
            margin: 20px 0;
            min-height: 28px;
            color: var(--text-dark);
            font-size: 1.3rem;
            font-weight: bold;
            display: inline-block;
        }
        
        .now-playing.active-animation {
            animation: wavePulse 3s infinite ease-in-out;
        }

        audio {
            width: 100%;
            margin-top: 10px;
            border-radius: 8px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        button {
            font-family: "Times New Roman", Times, serif;
            background-color: var(--ocean-blue);
            color: var(--foam-white);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 20px;
            font-size: 1.05rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        button:hover {
            background-color: var(--text-dark);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.active {
            background-color: var(--accent-gold);
            color: var(--text-dark);
            font-weight: bold;
            border-color: var(--accent-gold);
        }

        .playlist-container {
            max-height: 350px;
            overflow-y: auto;
            padding: 0;
        }

        .playlist-header {
            padding: 15px 20px;
            background-color: rgba(74, 107, 122, 0.1);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            font-size: 1.3rem;
            font-style: italic;
            position: sticky;
            top: 0;
            color: var(--ocean-blue);
            text-align: left;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .track-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .track-item {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            font-size: 1.1rem;
        }

        .track-item:hover {
            background-color: rgba(255, 255, 255, 0.5);
            padding-left: 25px; /* Subtle hover slide animation */
            color: var(--ocean-blue);
        }

        .track-item.playing {
            background-color: rgba(74, 107, 130, 0.12);
            color: var(--ocean-blue);
            font-weight: bold;
            border-left: 5px solid var(--accent-gold);
            padding-left: 25px;
        }

        /* Custom Scrollbar for the playlist to keep it looking clean */
        .playlist-container::-webkit-scrollbar {
            width: 6px;
        }
        .playlist-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .playlist-container::-webkit-scrollbar-thumb {
            background: rgba(74, 107, 130, 0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="player-container">
            <h1>Summer Sounds</h1>
            <div class="subtitle">By the Sea</div>
            <div class="now-playing" id="nowPlaying">Select a track to begin</div>
            
            <audio id="audioPlayer" controls></audio>
            
            <div class="controls">
                <button id="prevBtn">Previous</button>
                <button id="nextBtn">Next</button>
                <button id="shuffleBtn">Shuffle: OFF</button>
            </div>
        </div>

        <div class="playlist-container">
            <div class="playlist-header">The Tracklist</div>
            <ul class="track-list" id="trackList">
                </ul>
        </div>
    </div>

    <script>
        // 1. CONFIGURATION: Update these to match your GitHub setup
        const githubUsername = "YOUR_USERNAME";
        const repoName = "YOUR_REPO_NAME";
        const folderName = "Summer Playlist"; // Matches your Linux folder name

        // Base URL construction for GitHub Pages
        const baseUrl = `https://${githubUsername}.github.io/${repoName}/${folderName ? encodeURIComponent(folderName) + '/' : ''}`;

        // 2. PASTE THE ARRAY GENERATED BY YOUR PYTHON SCRIPT DIRECTLY HERE:
        const mp3Files = [
            "(I Just) Died In Your Arms.mp3",
    "9 to 5.mp3",
    "A Symptom Of Being Human.mp3",
    "Africa.mp3",
    "Ain_t No Mountain High Enough.mp3",
    "American Pie.mp3",
    "Bitter Sweet Symphony - Remastered.mp3",
    "Born in the U.S.A.mp3",
    "Break My Stride.mp3",
    "Brown Eyed Girl.mp3",
    "Cadillac Ranch.mp3",
    "Chicken Fried.mp3",
    "Come On Eileen.mp3",
    "Come Together - Remastered.mp3",
    "Cruel Summer.mp3",
    "Dancing In the Dark.mp3",
    "Dancing in the Moonlight.mp3",
    "Don_t Bring Me Down.mp3",
    "Don_t Go Breaking My Heart.mp3",
    "Don_t Stop Believin_ ( Remaster).mp3",
    "Don_t You (Forget About Me).mp3",
    "Dreams - Remaster.mp3",
    "Dreams.mp3",
    "End of Beginning.mp3",
    "Escape (The Pina Colada Song).mp3",
    "Espresso.mp3",
    "Everywhere - Remaster.mp3",
    "Fast Car.mp3",
    "Fishin_ in the Dark.mp3",
    "Fortunate Son.mp3",
    "Free Fallin.mp3",
    "Go Your Own Way - Remaster.mp3",
    "Got My Mind Set on You.mp3",
    "Happy Together.mp3",
    "Have You Ever Seen The Rain.mp3",
    "Heart Of Glass.mp3",
    "Heaven Is A Place On Earth - Promo _ Edit.mp3",
    "Here Comes The Sun - Remastered.mp3",
    "Hold the Line.mp3",
    "Hooked On A Feeling.mp3",
    "I Still Haven_t Found What I_m Looking For.mp3",
    "I_m Gonna Be ( Miles).mp3",
    "In The Air Tonight - Remastered.mp3",
    "Jenny Jenny.mp3",
    "Karma Chameleon - Remastered.mp3",
    "Kokomo.mp3",
    "Kung Fu Fighting.mp3",
    "Landslide.mp3",
    "Little Lies.mp3",
    "Livin_ On A Prayer.mp3",
    "Long Train Runnin.mp3",
    "Lovely Day.mp3",
    "Lush Life.mp3",
    "Man in the Mirror - Remaster.mp3",
    "Maneater.mp3",
    "Memory Lane.mp3",
    "More Than a Feeling.mp3",
    "Mr Blue Sky.mp3",
    "My Life.mp3",
    "Old Time Rock & Roll.mp3",
    "Opalite.mp3",
    "Rich Girl.mp3",
    "Rocket Man (I Think It_s Going To Be A Long, Long Time).mp3",
    "Rocky Top.mp3",
    "Rosanna.mp3",
    "Send Me On My Way.mp3",
    "Style.mp3",
    "Summer Of.mp3",
    "Sweet Caroline.mp3",
    "Sweet Home Alabama.mp3",
    "Tainted Love.mp3",
    "Take A Chance On Me.mp3",
    "Take It Easy - Remaster.mp3",
    "The Boys Of Summer.mp3",
    "The Chain - Remaster.mp3",
    "The Fate of Ophelia.mp3",
    "The Power Of Love.mp3",
    "Time After Time.mp3",
    "Tiny Dancer.mp3",
    "Tubthumping.mp3",
    "Uptown Girl.mp3",
    "Wagon Wheel.mp3",
    "Walking On Sunshine.mp3",
    "Walking in Memphis.mp3",
    "We Didn_t Start the Fire.mp3",
    "Wouldn_t It Be Nice.mp3",
    "You Get What You Give.mp3",
    "You Make My Dreams (Come True).mp3",
    "You_re So Vain.mp3",
    "Your Love.mp3",
    "red-hot-chili-peppers_can-t-stop.mp3"
            // ... Delete these placeholders and paste your whole 90-song list here
        ];

        // State Tracking
        let currentTrackIndex = 0;
        let isShuffle = false;
        let playbackOrder = [...Array(mp3Files.length).keys()];

        // Elements
        const audioPlayer = document.getElementById('audioPlayer');
        const nowPlayingText = document.getElementById('nowPlaying');
        const trackListContainer = document.getElementById('trackList');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');

        // Build UI List elements
        function buildPlaylistUI() {
            trackListContainer.innerHTML = '';
            mp3Files.forEach((file, index) => {
                const li = document.createElement('li');
                li.classList.add('track-item');
                li.id = `track-${index}`;
                // Clean the text dynamically for UI representation (stripping extension)
                li.textContent = file.replace('.mp3', '');
                
                li.addEventListener('click', () => {
                    currentTrackIndex = playbackOrder.indexOf(index);
                    loadAndPlayTrack();
                });
                trackListContainer.appendChild(li);
            });
        }

        // Handle Audio Source loading and Play states
        function loadAndPlayTrack() {
            const actualFileIndex = playbackOrder[currentTrackIndex];
            const fileName = mp3Files[actualFileIndex];
            
            audioPlayer.src = baseUrl + encodeURIComponent(fileName);
            nowPlayingText.textContent = fileName.replace('.mp3', '');
            nowPlayingText.classList.add('active-animation');

            document.querySelectorAll('.track-item').forEach(el => el.classList.remove('playing'));
            const currentVisualItem = document.getElementById(`track-${actualFileIndex}`);
            if (currentVisualItem) {
                currentVisualItem.classList.add('playing');
                currentVisualItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            audioPlayer.play();
        }

        // Shuffle Sequence Generator
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            const currentActualIndex = playbackOrder[currentTrackIndex];

            if (isShuffle) {
                shuffleBtn.classList.add('active');
                shuffleBtn.textContent = "Shuffle: ON";
                
                playbackOrder = playbackOrder.filter(item => item !== currentActualIndex);
                shuffleArray(playbackOrder);
                playbackOrder.unshift(currentActualIndex);
                currentTrackIndex = 0;
            } else {
                shuffleBtn.classList.remove('active');
                shuffleBtn.textContent = "Shuffle: OFF";
                
                playbackOrder = [...Array(mp3Files.length).keys()];
                currentTrackIndex = playbackOrder.indexOf(currentActualIndex);
            }
        }

        // Event Control Registries
        nextBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playbackOrder.length;
            loadAndPlayTrack();
        });

        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playbackOrder.length) % playbackOrder.length;
            loadAndPlayTrack();
        });

        shuffleBtn.addEventListener('click', toggleShuffle);

        audioPlayer.addEventListener('ended', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playbackOrder.length;
            loadAndPlayTrack();
        });

        // Fire everything up on startup
        buildPlaylistUI();
        if(mp3Files.length > 0) {
            audioPlayer.src = baseUrl + encodeURIComponent(mp3Files[0]);
        }
    </script>
</body>
</html>
